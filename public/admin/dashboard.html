<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard | Admin</title>
<link href="../assets/css/style.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&family=Corinthia:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="admin-shell"></div>
<div id="notification"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(async () => {
await renderAdminShell('Dashboard', 'Dashboard');
const posts = await DB.getPosts();
const s = await DB.getSettings();
const lastPost = posts.length > 0 ? posts.reduce((a, b) => new Date(a.date) > new Date(b.date) ? a : b) : null;
const comments = await DB.getComments();

document.getElementById('admin-content').innerHTML = `
  <h1 class="font-headline-md text-headline-md text-on-surface mb-lg">Dashboard</h1>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-md mb-lg">
    <div class="bg-surface p-lg rounded-xl shadow-sm border-l-4 border-primary">
      <span class="material-symbols-outlined text-primary text-3xl mb-sm">article</span>
      <p class="font-label-md text-secondary uppercase tracking-widest text-caption">Total de Posts</p>
      <p class="font-display-lg text-display-lg text-primary">${posts.length}</p>
    </div>
    <div class="bg-surface p-lg rounded-xl shadow-sm border-l-4 border-primary-fixed-dim">
      <span class="material-symbols-outlined text-primary text-3xl mb-sm">calendar_today</span>
      <p class="font-label-md text-secondary uppercase tracking-widest text-caption">Última Publicação</p>
      <p class="font-headline-sm text-headline-sm text-primary">${lastPost ? lastPost.date : '—'}</p>
    </div>
    <div class="bg-surface p-lg rounded-xl shadow-sm border-l-4 border-tertiary">
      <span class="material-symbols-outlined text-primary text-3xl mb-sm">comment</span>
      <p class="font-label-md text-secondary uppercase tracking-widest text-caption">Comentários Pendentes</p>
      <p class="font-display-lg text-display-lg text-primary">${comments.filter(c => !c.approved).length}</p>
    </div>
  </div>
  <div class="bg-surface p-lg rounded-xl shadow-sm">
    <h2 class="font-label-md text-secondary uppercase tracking-widest mb-md">Posts Recentes</h2>
    ${posts.length === 0 ? '<p class="text-on-surface-variant">Nenhum post publicado.</p>' :
      '<div class="space-y-sm">' + posts.slice(0, 5).map(p => `
        <div class="flex justify-between items-center py-sm border-b border-outline-variant/30">
          <span class="font-body-md text-on-surface">${p.title}</span>
          <span class="font-caption text-secondary">${p.date}</span>
        </div>
      `).join('') + '</div>'}
  </div>
`;
})();
</script>
</body>
</html>
