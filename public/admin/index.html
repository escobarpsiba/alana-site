<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login | Admin</title>
<link href="../assets/css/style.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&family=Corinthia:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-surface flex items-center justify-center min-h-screen">
<div class="max-w-sm w-full mx-gutter">
  <div class="text-center mb-xl">
    <h1 class="font-display-lg text-headline-md text-primary mb-xs">Alana Piranji</h1>
    <p class="font-body-md text-on-surface-variant">Acesso Administrativo</p>
  </div>
  <div class="bg-surface-container p-lg rounded-xl shadow-lg">
    <form id="loginForm" class="space-y-md">
      <div>
        <label class="font-label-md text-label-md text-secondary uppercase tracking-widest block mb-xs">Senha</label>
        <input id="password" type="password" required
          class="w-full border-b border-outline bg-transparent focus:border-primary outline-none py-sm text-body-md transition-colors"
          placeholder="Digite sua senha"/>
      </div>
      <p id="loginError" class="text-caption text-red-600 hidden">Senha incorreta</p>
      <button type="submit" class="w-full bg-primary text-on-primary py-sm rounded-lg font-label-md hover:scale-[1.02] transition-transform">
        Entrar
      </button>
    </form>
  </div>
  <a href="../index.html" class="block text-center mt-md font-label-md text-primary hover:underline">Voltar ao site</a>
</div>
<script src="../assets/js/data.js"></script>
<script>
  document.getElementById('loginForm').onsubmit = (e) => {
    e.preventDefault();
    if (document.getElementById('password').value === 'alana2026') {
      sessionStorage.setItem('alana_admin', 'true');
      window.location.href = 'dashboard.html';
    } else {
      document.getElementById('loginError').classList.remove('hidden');
    }
  };
</script>
</body>
</html>
