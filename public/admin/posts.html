<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Posts | Admin</title>
<link href="../assets/css/style.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&family=Corinthia:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet"/>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
</head>
<body>
<div id="admin-shell"></div>
<div id="notification"></div>
<div id="postModal" class="fixed inset-0 z-50 bg-black/40 hidden items-center justify-center p-gutter" onclick="if(event.target===this)closeModal()">
  <div class="bg-surface rounded-xl p-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl" onclick="event.stopPropagation()">
    <h3 id="modalTitle" class="font-headline-sm text-headline-sm text-primary mb-md"></h3>
    <form id="postForm" class="space-y-md">
      <input id="editSlug" type="hidden"/>
      <div><label class="font-label-md text-label-md text-secondary uppercase tracking-widest block mb-xs">Título</label>
        <input id="postTitle" required class="w-full border-b border-outline bg-transparent focus:border-primary outline-none py-sm text-body-md"/></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
        <div><label class="font-label-md text-label-md text-secondary uppercase tracking-widest block mb-xs">Tag</label>
          <select id="postTag" class="w-full border-b border-outline bg-transparent focus:border-primary outline-none py-sm text-body-md">
            <option value="">Nova tag...</option>
          </select>
          <input id="postTagNew" class="w-full border-b border-outline bg-transparent focus:border-primary outline-none py-sm text-body-md mt-xs hidden" placeholder="Nova tag"/></div>
        <div><label class="font-label-md text-label-md text-secondary uppercase tracking-widest block mb-xs">Categoria</label>
          <select id="postCategory" class="w-full border-b border-outline bg-transparent focus:border-primary outline-none py-sm text-body-md">
            <option value="teoria">Teoria</option>
            <option value="clinica">Clínica</option>
            <option value="cultura">Cultura</option>
            <option value="geral">Geral</option>
          </select></div>
      </div>
      <div><label class="font-label-md text-label-md text-secondary uppercase tracking-widest block mb-xs">Resumo</label>
        <textarea id="postExcerpt" rows="2" class="w-full border-b border-outline bg-transparent focus:border-primary outline-none py-sm text-body-md resize-none"></textarea></div>
      <div><label class="font-label-md text-label-md text-secondary uppercase tracking-widest block mb-xs">URL da Imagem de Capa</label>
        <input id="postImage" class="w-full border-b border-outline bg-transparent focus:border-primary outline-none py-sm text-body-md" placeholder="https://images.unsplash.com/photo-...?w=800&q=80"/></div>
      <div><label class="font-label-md text-label-md text-secondary uppercase tracking-widest block mb-xs">Conteúdo</label>
        <div id="editor-container" class="border border-outline rounded-lg" style="min-height: 320px;"></div>
        <p class="text-caption text-secondary mt-xs">Use o editor para formatar o texto. Para adicionar imagens, clique no ícone de imagem na toolbar.</p></div>
      <div class="flex gap-md pt-sm">
        <button type="submit" class="bg-primary text-on-primary px-lg py-sm rounded-lg font-label-md hover:scale-[1.02] transition-transform">Salvar</button>
        <button type="button" onclick="closeModal()" class="border border-outline text-on-surface px-lg py-sm rounded-lg font-label-md hover:bg-surface-container transition-all">Cancelar</button>
      </div>
    </form>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
let quill = null;

function initQuill() {
  if (quill) return;
  const Toolbar = Quill.import('modules/toolbar');
  const Image = Quill.import('formats/image');

  quill = new Quill('#editor-container', {
    modules: {
      toolbar: {
        container: [
          ['bold', 'italic', 'underline', 'strike'],
          ['blockquote', 'code-block'],
          [{ 'header': [2, 3, 4, false] }],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          ['link', 'image'],
          ['clean']
        ],
        handlers: {
          image: function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.click();
            input.onchange = function () {
              const file = input.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = function (e) {
                const range = quill.getSelection(true);
                quill.insertEmbed(range.index, 'image', e.target.result);
              };
              reader.readAsDataURL(file);
            };
          }
        }
      }
    },
    placeholder: 'Escreva seu conteúdo aqui...',
    theme: 'snow'
  });
}

async function renderPosts() {
  const posts = await DB.getPosts();
  const cats = await DB.getCategories();
  document.getElementById('admin-content').innerHTML = `
    <div class="flex items-center justify-between mb-lg">
      <h1 class="font-headline-md text-headline-md text-on-surface">Posts</h1>
      <button onclick="openCreateModal()" class="bg-primary text-on-primary px-lg py-sm rounded-lg font-label-md flex items-center gap-xs hover:scale-[1.02] transition-transform">
        <span class="material-symbols-outlined text-[18px]">add</span> Novo Post
      </button>
    </div>
    ${posts.length === 0 ? '<div class="bg-surface p-xl rounded-xl text-center"><p class="text-on-surface-variant">Nenhum post publicado. Crie o primeiro!</p></div>' : `
    <div class="bg-surface rounded-xl shadow-sm overflow-x-auto">
      <table class="w-full">
        <thead><tr class="border-b border-outline-variant/30">
          <th class="text-left font-label-md text-secondary uppercase tracking-widest text-caption p-md">Título</th>
          <th class="text-left font-label-md text-secondary uppercase tracking-widest text-caption p-md hidden md:table-cell">Tag</th>
          <th class="text-left font-label-md text-secondary uppercase tracking-widest text-caption p-md hidden lg:table-cell">Data</th>
          <th class="text-right font-label-md text-secondary uppercase tracking-widest text-caption p-md">Ações</th>
        </tr></thead>
        <tbody>${posts.map(p => `
          <tr class="border-b border-outline-variant/20 hover:bg-surface-container/50 transition-colors">
            <td class="p-md"><span class="font-body-md text-on-surface">${p.title}</span></td>
            <td class="p-md hidden md:table-cell"><span class="font-caption text-secondary">${p.tag}</span></td>
            <td class="p-md hidden lg:table-cell"><span class="font-caption text-secondary">${p.date}</span></td>
            <td class="p-md text-right">
              <button onclick="openEditModal('${p.slug}')" class="text-primary hover:bg-primary-fixed/30 p-xs rounded-lg transition-all" title="Editar"><span class="material-symbols-outlined">edit</span></button>
              <button onclick="deletePost('${p.slug}')" class="text-error hover:bg-error-container/30 p-xs rounded-lg transition-all" title="Excluir"><span class="material-symbols-outlined">delete</span></button>
            </td>
          </tr>
        `).join('')}</tbody>
      </table>
    </div>`}
  `;
}

async function populateTagSelect(selected) {
  const cats = await DB.getCategories();
  document.getElementById('postTag').innerHTML = '<option value="">Nova tag...</option>' + cats.map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`).join('');
}

async function openCreateModal() {
  await populateTagSelect();
  initQuill();
  document.getElementById('modalTitle').textContent = 'Novo Post';
  document.getElementById('editSlug').value = '';
  document.getElementById('postTitle').value = '';
  document.getElementById('postTag').value = '';
  document.getElementById('postTagNew').value = '';
  document.getElementById('postTagNew').classList.add('hidden');
  document.getElementById('postCategory').value = 'teoria';
  document.getElementById('postExcerpt').value = '';
  document.getElementById('postImage').value = '';
  document.getElementById('postModal').classList.remove('hidden');
  document.getElementById('postModal').classList.add('flex');
  setTimeout(() => { quill.root.innerHTML = ''; }, 50);
}

async function openEditModal(slug) {
  initQuill();
  const p = await DB.getPost(slug);
  if (!p) return;
  await populateTagSelect(p.tag);
  document.getElementById('modalTitle').textContent = 'Editar Post';
  document.getElementById('editSlug').value = slug;
  document.getElementById('postTitle').value = p.title;
  const tagSelect = document.getElementById('postTag');
  const hasCat = [...tagSelect.options].some(o => o.value === p.tag);
  if (hasCat) { tagSelect.value = p.tag; document.getElementById('postTagNew').classList.add('hidden'); }
  else { tagSelect.value = ''; document.getElementById('postTagNew').value = p.tag; document.getElementById('postTagNew').classList.remove('hidden'); }
  document.getElementById('postCategory').value = p.category;
  document.getElementById('postExcerpt').value = p.excerpt;
  document.getElementById('postImage').value = p.image || '';
  document.getElementById('postModal').classList.remove('hidden');
  document.getElementById('postModal').classList.add('flex');
  setTimeout(() => { quill.root.innerHTML = p.content || ''; }, 50);
}

function closeModal() {
  document.getElementById('postModal').classList.add('hidden');
  document.getElementById('postModal').classList.remove('flex');
}

async function deletePost(slug) {
  if (confirm('Tem certeza que deseja excluir este post?')) {
    await DB.deletePost(slug);
    showNotification('Post excluído.', 'success');
    await renderPosts();
  }
}

(async () => {
  await renderAdminShell('Posts', 'Posts');
  await renderPosts();

  document.getElementById('postTag').onchange = function() {
    document.getElementById('postTagNew').classList.toggle('hidden', this.value !== '');
  };

  document.getElementById('postForm').onsubmit = async function(e) {
    e.preventDefault();
    const editSlug = document.getElementById('editSlug').value;
    const tag = document.getElementById('postTag').value || document.getElementById('postTagNew').value;
    const data = {
      title: document.getElementById('postTitle').value,
      tag: tag,
      category: document.getElementById('postCategory').value,
      excerpt: document.getElementById('postExcerpt').value,
      image: document.getElementById('postImage').value || '',
      content: quill ? quill.root.innerHTML : ''
    };
    if (!tag) { showNotification('Selecione ou crie uma tag.', 'error'); return; }
    if (editSlug) {
      await DB.updatePost(editSlug, data);
      showNotification('Post atualizado!', 'success');
    } else {
      await DB.createPost(data);
      showNotification('Post criado!', 'success');
    }
    closeModal();
    await renderPosts();
  };
})();
</script>
</body>
</html>
